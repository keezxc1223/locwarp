<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<title>LocWarp</title>
<!-- Add to Home Screen: opens full screen, without browser chrome. -->
<link rel="manifest" href="/phone/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/phone/icon.png" />
<link rel="icon" type="image/png" href="/phone/icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="LocWarp" />
<meta name="theme-color" content="#0e1015" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  :root {
    --bg: #0e1015;
    /* Theme accent as bare R, G, B. The desktop's theme (設定 > 外觀)
       overwrites this one value at runtime; every tint derives from it. */
    --accent-rgb: 108, 140, 255;
    --accent: rgb(var(--accent-rgb));
    --accent-strong: color-mix(in srgb, var(--accent) 86%, black);
    --accent-top: color-mix(in srgb, var(--accent) 86%, white);
    --accent-light: color-mix(in srgb, var(--accent) 62%, white);
    --accent-lighter: color-mix(in srgb, var(--accent) 40%, white);
    --accent-soft: rgba(var(--accent-rgb), 0.2);
    --danger: #ff6b6b;
    --warn: #f5b955;
    --ok: #4dd28a;
    --text: #eef0f6;
    --muted: #a3acc0;
    --hairline: rgba(255,255,255,0.14);
    --fill: rgba(255,255,255,0.07);
    --fill-press: rgba(255,255,255,0.14);
    --spring: cubic-bezier(.2,.9,.25,1.1);
    --ease-out: cubic-bezier(.2,.8,.2,1);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }

  /* ── Glass surfaces ───────────────────────────────────────────
     Frosted "liquid glass": a translucent tint over a blurred, saturated
     backdrop, with a bright top rim and a dark bottom rim standing in for
     the specular edge. Kept to plain backdrop-filter (no SVG refraction,
     which Safari does not render) and only ever animated with transform /
     opacity, so it stays on the compositor. Browsers without
     backdrop-filter get the opaque tier below. */
  .glass {
    background: rgba(27,31,42,0.96);
    border: 1px solid var(--hairline);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.20),
      inset 0 -1px 0 rgba(0,0,0,0.28),
      0 10px 30px rgba(0,0,0,0.38);
  }
  @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .glass {
      background: linear-gradient(180deg, rgba(46,52,70,0.62), rgba(22,26,36,0.70));
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      backdrop-filter: blur(22px) saturate(180%);
    }
    /* Large moving surfaces: denser tint so less of the blur is doing the
       work while the sheet slides. */
    .glass.dense { background: linear-gradient(180deg, rgba(38,43,58,0.86), rgba(20,23,32,0.92)); }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Total page-zoom lockout. `pan-x pan-y` lets the user scroll/pan but
     disables the pinch gesture, so the browser never zooms the page (which
     would throw the fixed overlays out of the visual viewport, and on iOS
     Safari that zoom state persists across refresh). Leaflet's own
     pinch-to-zoom keeps working because it listens to touch events
     directly. */
  html, body { touch-action: pan-x pan-y; }
  #map { touch-action: none; }
  button, input, .pill, .sheet, .modal { touch-action: manipulation; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  button { font-family: inherit; color: inherit; }
  #map { position: fixed; inset: 0; background: #1a1d22; }
  .leaflet-container { background: #1a1d22; font-family: inherit; }
  .leaflet-control-attribution { font-size: 9px !important; opacity: 0.55; }
  .leaflet-top.leaflet-left { top: calc(var(--safe-t) + 4px); }
  .leaflet-bar { border: 1px solid var(--hairline) !important; border-radius: 12px !important; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,0.35) !important; }
  .leaflet-bar a { background: rgba(27,31,42,0.9) !important; color: var(--text) !important; border-bottom-color: var(--hairline) !important; width: 36px !important; height: 36px !important; line-height: 36px !important; }

  /* Pressable: one shared press response for every control. */
  .press { transition: transform 0.22s var(--spring), background-color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease; }
  .press:active { transform: scale(0.955); transition-duration: 0.08s; }
  :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* ── Top bar ────────────────────────────────────────────────── */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5000;
    padding: calc(var(--safe-t) + 8px) 12px 8px;
    pointer-events: none;
    display: flex; align-items: flex-start; gap: 6px; justify-content: flex-end;
  }
  .pill {
    pointer-events: auto; border-radius: 999px;
    padding: 6px 11px; font-size: 12px; line-height: 1;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex-shrink: 0; }
  .dot.off { background: var(--danger); }
  .dot.busy { background: var(--warn); }
  #device-pills { pointer-events: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  /* Full device name, wrapping if it has to; never cut off. */
  #device-pills .pill { border-radius: 16px; max-width: calc(100vw - 24px); }
  .dev-name { min-width: 0; line-height: 1.25; overflow-wrap: anywhere; }
  .dev-state { flex-shrink: 0; white-space: nowrap; }
  .dev-state { color: var(--muted); font-size: 10.5px; }
  .pill.no-device { color: var(--muted); }

  /* "Tap the map" hint, centred under the top bar. */
  #hint {
    position: fixed; left: 50%; top: calc(var(--safe-t) + 52px); z-index: 5000;
    padding: 9px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap;
    background: linear-gradient(180deg, var(--accent-top), var(--accent-strong)); color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 8px 22px rgba(60,90,220,0.45);
    transform: translate(-50%, -14px) scale(0.96); opacity: 0; pointer-events: none;
    transition: transform 0.26s var(--spring), opacity 0.18s ease;
  }
  #hint.show { transform: translate(-50%, 0) scale(1); opacity: 1; }

  /* ── Floating controls (bottom) ─────────────────────────────── */
  #fab {
    position: fixed; right: 16px; bottom: calc(var(--safe-b) + 20px); z-index: 5100;
    width: 58px; height: 58px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.32);
    background: linear-gradient(150deg, rgba(140,165,255,0.95), rgba(84,112,240,0.95));
    color: #fff; cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), inset 0 -2px 6px rgba(40,60,180,0.5), 0 10px 26px rgba(70,100,235,0.5);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.26s var(--spring), opacity 0.16s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  #fab:active { transform: scale(0.93); transition-duration: 0.08s; }
  #fab svg { width: 26px; height: 26px; transition: transform 0.3s var(--spring); }
  #fab.armed {
    background: linear-gradient(150deg, rgba(60,66,84,0.95), rgba(34,38,50,0.95));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 8px 20px rgba(0,0,0,0.5);
  }
  #fab.armed svg { transform: rotate(135deg); }
  #fab.hidden { transform: scale(0.6); opacity: 0; pointer-events: none; }

  #recenter {
    position: fixed; right: 22px; bottom: calc(var(--safe-b) + 92px); z-index: 5100;
    width: 46px; height: 46px; border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: var(--text);
  }
  #recenter svg { width: 21px; height: 21px; }
  #recenter.off { color: var(--muted); }
  #recenter.hidden { opacity: 0; pointer-events: none; }

  /* Now-moving bar: progress + pause / speed / stop while a route runs. */
  #nowbar {
    position: fixed; left: 16px; right: 86px; bottom: calc(var(--safe-b) + 20px); z-index: 5100;
    height: 58px; border-radius: 20px; padding: 0 6px 0 14px;
    display: flex; align-items: center; gap: 6px; overflow: hidden;
    transform: translateY(24px) scale(0.96); opacity: 0; pointer-events: none;
    transition: transform 0.3s var(--spring), opacity 0.18s ease;
  }
  #nowbar.show { transform: none; opacity: 1; pointer-events: auto; }
  #nowbar.hidden { opacity: 0 !important; pointer-events: none !important; }
  #nowbar .nb-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  #nowbar .nb-title { font-size: 13px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
  #nowbar .nb-sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  #nowbar .nb-btn {
    width: 40px; height: 40px; flex-shrink: 0; border-radius: 13px; border: none; cursor: pointer;
    background: var(--fill); display: flex; align-items: center; justify-content: center;
  }
  #nowbar .nb-btn:active { background: var(--fill-press); }
  #nowbar .nb-btn svg { width: 18px; height: 18px; }
  #nowbar .nb-btn.stop { color: var(--danger); }
  #nowbar .nb-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,0.08); }
  #nowbar .nb-progress i {
    display: block; height: 100%; width: 100%; transform-origin: left center; transform: scaleX(0);
    background: linear-gradient(90deg, var(--accent), var(--accent-light)); transition: transform 1s linear;
  }
  #nowbar.paused .nb-progress i { background: var(--warn); }

  /* ── Sheets ─────────────────────────────────────────────────── */
  #scrim {
    position: fixed; inset: 0; z-index: 5200; background: rgba(6,8,12,0.5);
    opacity: 0; pointer-events: none; transition: opacity 0.16s ease-in;
  }
  #scrim.show { opacity: 1; pointer-events: auto; transition: opacity 0.24s ease-out; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5210;
    max-width: 480px; margin: 0 auto; border-bottom: none;
    border-radius: 26px 26px 0 0;
    padding: 8px 14px calc(var(--safe-b) + 16px);
    transform: translateY(105%); visibility: hidden; will-change: transform;
    transition: transform 0.18s ease-in, visibility 0s linear 0.18s;
    display: flex; flex-direction: column; max-height: 86vh;
  }
  .sheet.open { transform: translateY(0); visibility: visible; transition: transform 0.34s var(--ease-out), visibility 0s; }
  .sheet:focus { outline: none; }
  .sheet.tall { height: 82vh; }
  .grabber { width: 38px; height: 5px; border-radius: 5px; background: rgba(255,255,255,0.26); margin: 2px auto 10px; flex-shrink: 0; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; flex-shrink: 0; }
  .sheet-head h2 { margin: 0; font-size: 18px; font-weight: 680; letter-spacing: 0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet-sub { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 12px; color: var(--muted); }
  .head-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--fill); display: flex; align-items: center; justify-content: center; color: var(--muted);
  }
  .icon-btn:active { background: var(--fill-press); }
  .icon-btn svg { width: 18px; height: 18px; }
  .lang-btn { width: auto; padding: 0 13px; font-size: 12px; font-weight: 650; border-radius: 999px; color: var(--text); }
  .group-label { font-size: 11px; font-weight: 650; letter-spacing: 0.07em; color: var(--muted); margin: 14px 4px 7px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .tile {
    display: flex; align-items: center; gap: 11px; min-height: 64px;
    padding: 10px 12px; text-align: left; cursor: pointer;
    background: var(--fill); border: 1px solid rgba(255,255,255,0.09); border-radius: 18px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    opacity: 0; transform: translateY(12px) scale(0.98);
  }
  .sheet.open .tile { animation: rise 0.36s var(--spring) forwards; animation-delay: calc(var(--i, 0) * 28ms + 50ms); }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .tile:active { background: var(--fill-press); }
  .tile .ic {
    width: 40px; height: 40px; border-radius: 13px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--accent-soft); color: var(--accent-light);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.16);
    transition: transform 0.22s var(--spring);
  }
  .tile:active .ic { transform: scale(0.88); transition-duration: 0.08s; }
  .tile .ic svg { width: 20px; height: 20px; }
  .tile .tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .tile .tt { font-size: 14px; font-weight: 620; line-height: 1.2; }
  .tile .ds { font-size: 11px; color: var(--muted); line-height: 1.3; }
  .tile[data-kind="navigate"] .ic { background: rgba(77,210,138,0.18); color: var(--ok); }
  .tile[data-kind="bookmarks"] .ic { background: rgba(255,200,87,0.18); color: #ffd27a; }
  .tile[data-kind="recent"] .ic { background: rgba(120,200,255,0.18); color: #8fd3ff; }
  .tile[data-kind="search"] .ic { background: rgba(170,150,240,0.2); color: #c3b1ff; }
  .tile[data-kind="stop"] .ic { background: rgba(245,185,85,0.18); color: var(--warn); }
  .tile[data-kind="restore"] .ic { background: rgba(255,107,107,0.18); color: var(--danger); }
  .tile[data-kind="restore"] .tt { color: #ff9a9a; }
  .tile[data-kind="install"] .ic { background: rgba(255,255,255,0.1); color: var(--text); }
  .tile.wide { grid-column: 1 / -1; min-height: 54px; }
  /* Unavailable right now: still tappable so the tap can explain why. */
  .tile.blocked .ic, .tile.blocked .tt { opacity: 0.45; }
  .tile.blocked .ds { color: var(--warn); }
  /* Something is moving: Stop becomes the highlighted action. */
  .tile.live { border-color: rgba(245,185,85,0.55); background: rgba(245,185,85,0.1); }

  /* Buttons in sheets / modals */
  .btn-row { display: flex; gap: 8px; margin-top: 4px; flex-shrink: 0; }
  .btn {
    flex: 1; min-height: 48px; padding: 0 12px; border-radius: 16px; cursor: pointer;
    font-size: 15px; font-weight: 640; border: 1px solid rgba(255,255,255,0.1);
    background: var(--fill); display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  }
  .btn:active { background: var(--fill-press); }
  .btn:disabled { opacity: 0.45; }
  .btn.primary {
    background: linear-gradient(180deg, var(--accent-top), var(--accent-strong)); color: #fff; border-color: rgba(255,255,255,0.28);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 6px 16px rgba(70,100,235,0.35);
  }
  .btn.go { background: rgba(77,210,138,0.16); color: #7be3ab; border-color: rgba(77,210,138,0.35); }
  .btn.danger { background: rgba(255,107,107,0.16); color: #ff9a9a; border-color: rgba(255,107,107,0.4); }

  .coord-line { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: var(--muted); margin: 0 2px 14px; line-height: 1.5; }
  .seg { display: flex; gap: 6px; margin-bottom: 10px; }
  .seg button {
    flex: 1; min-height: 46px; padding: 6px 4px; border-radius: 14px; cursor: pointer;
    font-size: 12px; font-weight: 560; line-height: 1.25; color: var(--muted);
    background: var(--fill); border: 1px solid rgba(255,255,255,0.08);
  }
  .seg button small { display: block; font-size: 10px; opacity: 0.8; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .seg button.active { background: var(--accent-soft); color: var(--accent-lighter); border-color: rgba(var(--accent-rgb),0.55); }
  .field-label { display: block; font-size: 11px; color: var(--muted); margin: 0 2px 5px; }
  /* font-size MUST be >= 16px or iOS Safari force-zooms the page on focus,
     which drops every fixed overlay out of the visual viewport. */
  .input {
    width: 100%; padding: 12px 13px; font-size: 16px; color: var(--text);
    background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; outline: none;
    margin-bottom: 12px; transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),0.22); }

  /* Lists (saved coordinates / recent / search results) */
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 10px; flex-shrink: 0; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; min-height: 34px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    font-size: 12px; font-weight: 560; color: var(--muted); white-space: nowrap;
    background: var(--fill); border: 1px solid rgba(255,255,255,0.08);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip i { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .chip.active { background: var(--accent-soft); color: var(--accent-lighter); border-color: rgba(var(--accent-rgb),0.55); }
  .list { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.22) transparent; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; margin: 0 -4px; padding: 0 4px; }
  .row {
    width: 100%; display: flex; align-items: center; gap: 11px; text-align: left; cursor: pointer;
    min-height: 56px; padding: 9px 10px; margin-bottom: 4px; border-radius: 16px;
    background: transparent; border: 1px solid transparent;
  }
  .row:active { background: var(--fill-press); }
  .row .bar { width: 4px; align-self: stretch; border-radius: 4px; background: var(--accent); flex-shrink: 0; margin: 4px 0; }
  .row .rc { width: 34px; height: 34px; border-radius: 11px; flex-shrink: 0; background: var(--fill); display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .row .rc svg { width: 16px; height: 16px; }
  .row .rt { flex: 1; min-width: 0; }
  .row .rn { font-size: 14px; font-weight: 580; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .rs { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .row .chev { color: rgba(255,255,255,0.3); flex-shrink: 0; }
  .row .chev svg { width: 14px; height: 14px; display: block; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 34px 16px; line-height: 1.6; white-space: pre-line; }
  .steps { margin: 2px 2px 14px; padding: 0; list-style: none; counter-reset: s; }
  .steps li { counter-increment: s; display: flex; gap: 11px; align-items: flex-start; font-size: 14px; line-height: 1.5; padding: 8px 0; }
  .steps li::before {
    content: counter(s); flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent-lighter); font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
  }

  /* Top-anchored cards for anything with a text field, so the on-screen
     keyboard never covers the input (a bottom sheet would sit under it). */
  .modal {
    position: fixed; inset: 0; z-index: 5300; background: rgba(6,8,12,0.55);
    display: flex; align-items: flex-start; justify-content: center;
    padding: calc(var(--safe-t) + 64px) 14px 14px;
    opacity: 0; visibility: hidden; transition: opacity 0.16s ease-in, visibility 0s linear 0.16s;
  }
  .modal.open { opacity: 1; visibility: visible; transition: opacity 0.22s ease-out, visibility 0s; }
  .modal .card {
    width: 100%; max-width: 420px; border-radius: 24px; padding: 16px;
    transform: translateY(-14px) scale(0.97); transition: transform 0.3s var(--spring);
    display: flex; flex-direction: column; max-height: calc(100vh - var(--safe-t) - 90px);
  }
  .modal.open .card { transform: none; }
  .modal h3 { margin: 0 2px 12px; font-size: 17px; font-weight: 680; }
  .format-note { font-size: 11px; color: var(--muted); margin: -6px 2px 12px; }

  /* Toast: above everything so feedback is always readable */
  #toast {
    position: fixed; left: 50%; top: calc(var(--safe-t) + 54px); z-index: 6000;
    transform: translate(-50%, -18px) scale(0.96);
    border-radius: 999px; padding: 10px 16px; font-size: 13px; font-weight: 560;
    opacity: 0; pointer-events: none; max-width: calc(100% - 32px); text-align: center;
    transition: opacity 0.18s ease, transform 0.3s var(--spring);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  #toast.err { border-color: rgba(255,107,107,0.65); color: #ffc2c2; }

  /* PIN gate */
  #gate {
    position: fixed; inset: 0; z-index: 7000; padding: 24px;
    background: radial-gradient(120% 80% at 50% 0%, #1d2540 0%, #0b0d12 70%);
    display: flex; align-items: center; justify-content: center;
  }
  #gate .card { width: 100%; max-width: 330px; border-radius: 26px; padding: 24px; }
  #gate h1 { font-size: 20px; margin: 0 0 6px; font-weight: 700; }
  #gate p { font-size: 13px; color: var(--muted); margin: 0 0 18px; line-height: 1.55; }
  #pin-input {
    width: 100%; font-size: 28px; letter-spacing: 8px; text-align: center; color: var(--text);
    background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.14); border-radius: 16px;
    padding: 14px 12px; outline: none; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  #pin-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),0.22); }
  #gate .btn { width: 100%; margin-top: 12px; }
  #gate .err { color: var(--danger); font-size: 13px; margin-top: 10px; min-height: 18px; }
  #gate .gate-lang { display: flex; justify-content: flex-end; margin: -6px -6px 6px 0; }

  /* Map markers */
  .pending-pin {
    width: 28px; height: 28px; border-radius: 50% 50% 50% 0;
    background: var(--accent); transform: rotate(-45deg) translate(7px, -7px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 2px solid #fff;
    animation: pin-drop 0.34s var(--spring);
  }
  @keyframes pin-drop { from { transform: rotate(-45deg) translate(22px, -22px); opacity: 0; } }
  .current-pin {
    width: 18px; height: 18px; border-radius: 50%; background: var(--ok); border: 3px solid #fff;
    box-shadow: 0 0 0 3px rgba(77,210,138,0.3), 0 4px 10px rgba(0,0,0,0.4); position: relative;
  }
  .current-pin::after {
    content: ''; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--ok);
    opacity: 0; animation: pulse 2.4s ease-out infinite;
  }
  @keyframes pulse { 0% { transform: scale(1); opacity: 0.7; } 70%, 100% { transform: scale(2.6); opacity: 0; } }
  /* Glide between status polls instead of hopping. Turned off while the
     map itself is animating a zoom, or the marker would lag behind it. */
  .glide .leaflet-marker-icon.cur { transition: transform 1s linear; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01s !important; animation-iteration-count: 1 !important; transition-duration: 0.01s !important; }
    .tile { opacity: 1; transform: none; }
  }
</style>

<body>

<div id="map"></div>

<div id="topbar"><span id="device-pills"></span></div>
<div id="hint" role="status" aria-live="polite"></div>

<!-- Now-moving bar -->
<div id="nowbar" class="glass">
  <div class="nb-text">
    <div class="nb-title"><span class="dot busy" id="nb-dot"></span><span id="nb-title" style="overflow:hidden;text-overflow:ellipsis"></span></div>
    <div class="nb-sub" id="nb-sub"></div>
  </div>
  <button type="button" class="nb-btn press" id="nb-pause" aria-label=""></button>
  <button type="button" class="nb-btn press" id="nb-speed" data-i18n-aria="speed_title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 14l4-6" /><path d="M4.5 18a9 9 0 1 1 15 0" /></svg>
  </button>
  <button type="button" class="nb-btn stop press" id="nb-stop" data-i18n-aria="stop">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2.5" /></svg>
  </button>
  <div class="nb-progress"><i id="nb-bar"></i></div>
</div>

<button id="recenter" type="button" class="glass press" data-i18n-aria="recenter">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3" /><circle cx="12" cy="12" r="7.5" /></svg>
</button>

<button id="fab" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="menu">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
</button>

<div id="scrim"></div>

<!-- Action menu -->
<div id="menu" class="sheet glass dense" role="dialog" aria-modal="true" aria-labelledby="menu-title" tabindex="-1">
  <div class="grabber"></div>
  <div class="sheet-head">
    <div style="min-width:0">
      <h2 id="menu-title" data-i18n="menu_title"></h2>
      <div class="sheet-sub"><span class="dot off" id="menu-dot"></span><span id="menu-status"></span></div>
    </div>
    <div class="head-actions">
      <button type="button" class="icon-btn lang-btn press" data-lang-toggle></button>
      <button type="button" class="icon-btn press" data-close data-i18n-aria="close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
    </div>
  </div>

  <div class="group-label" data-i18n="g_move"></div>
  <div class="grid">
    <button type="button" class="tile" data-kind="teleport" style="--i:0">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z" /></svg></span>
      <span class="tx"><span class="tt" data-i18n="teleport"></span><span class="ds" data-i18n="teleport_ds"></span></span>
    </button>
    <button type="button" class="tile" data-kind="navigate" style="--i:1">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3 11 22 2 13 21 11 13 3 11" /></svg></span>
      <span class="tx"><span class="tt" data-i18n="navigate"></span><span class="ds" id="navigate-ds"></span></span>
    </button>
  </div>

  <div class="group-label" data-i18n="g_places"></div>
  <div class="grid">
    <button type="button" class="tile" data-kind="bookmarks" style="--i:2">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8L12 3z" /></svg></span>
      <span class="tx"><span class="tt" data-i18n="bookmarks"></span><span class="ds" data-i18n="bookmarks_ds"></span></span>
    </button>
    <button type="button" class="tile" data-kind="recent" style="--i:3">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg></span>
      <span class="tx"><span class="tt" data-i18n="recent"></span><span class="ds" data-i18n="recent_ds"></span></span>
    </button>
    <button type="button" class="tile" data-kind="search" style="--i:4">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m21 21-4.3-4.3" /></svg></span>
      <span class="tx"><span class="tt" data-i18n="search"></span><span class="ds" data-i18n="search_ds"></span></span>
    </button>
    <button type="button" class="tile" data-kind="coord" style="--i:5">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z" /><circle cx="12" cy="10" r="3" /></svg></span>
      <span class="tx"><span class="tt" data-i18n="coord"></span><span class="ds" data-i18n="coord_ds"></span></span>
    </button>
  </div>

  <div class="group-label" data-i18n="g_control"></div>
  <div class="grid">
    <button type="button" class="tile" data-kind="stop" style="--i:6">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" /></svg></span>
      <span class="tx"><span class="tt" data-i18n="stop"></span><span class="ds" id="stop-ds"></span></span>
    </button>
    <button type="button" class="tile" data-kind="restore" style="--i:7">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" /></svg></span>
      <span class="tx"><span class="tt" data-i18n="restore"></span><span class="ds" data-i18n="restore_ds"></span></span>
    </button>
    <button type="button" class="tile wide" data-kind="install" id="install-tile" style="--i:8">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="3" /><path d="M12 8v6M9 11h6" /></svg></span>
      <span class="tx"><span class="tt" data-i18n="install"></span><span class="ds" data-i18n="install_ds"></span></span>
    </button>
  </div>
</div>

<!-- Confirm / place sheet (no scrim: the map and the pin stay usable) -->
<div id="confirm" class="sheet glass dense" role="dialog" aria-labelledby="confirm-title" tabindex="-1">
  <div class="grabber"></div>
  <div class="sheet-head"><h2 id="confirm-title"></h2></div>
  <div class="coord-line" id="confirm-coord"></div>
  <div id="confirm-speed" style="display:none">
    <div class="seg" data-speed-seg></div>
    <label class="field-label" for="confirm-custom" data-i18n="custom_speed"></label>
    <input class="input" type="number" id="confirm-custom" inputmode="decimal" min="0.1" max="300" step="0.5" />
  </div>
  <div class="btn-row" id="confirm-buttons"></div>
</div>

<!-- Speed sheet (while moving) -->
<div id="speed" class="sheet glass dense" role="dialog" aria-modal="true" aria-labelledby="speed-title" tabindex="-1">
  <div class="grabber"></div>
  <div class="sheet-head"><h2 id="speed-title" data-i18n="speed_title"></h2></div>
  <div class="seg" data-speed-seg></div>
  <label class="field-label" for="speed-custom" data-i18n="custom_speed"></label>
  <input class="input" type="number" id="speed-custom" inputmode="decimal" min="0.1" max="300" step="0.5" />
  <div class="btn-row">
    <button type="button" class="btn press" data-close data-i18n="cancel"></button>
    <button type="button" class="btn primary press" id="speed-apply" data-i18n="apply"></button>
  </div>
</div>

<!-- Saved coordinates / recent -->
<div id="places" class="sheet glass dense tall" role="dialog" aria-modal="true" aria-labelledby="places-title" tabindex="-1">
  <div class="grabber"></div>
  <div class="sheet-head">
    <h2 id="places-title"></h2>
    <div class="head-actions">
      <button type="button" class="icon-btn press" data-close data-i18n-aria="close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
    </div>
  </div>
  <input class="input" type="text" id="places-filter" autocomplete="off" style="margin-bottom:10px" />
  <div class="chips" id="places-chips"></div>
  <div class="list" id="places-list"></div>
</div>

<!-- Add to Home Screen instructions -->
<div id="install" class="sheet glass dense" role="dialog" aria-modal="true" aria-labelledby="install-title" tabindex="-1">
  <div class="grabber"></div>
  <div class="sheet-head"><h2 id="install-title" data-i18n="install"></h2></div>
  <ol class="steps" id="install-steps"></ol>
  <div class="btn-row"><button type="button" class="btn primary press" data-close data-i18n="got_it"></button></div>
</div>

<div id="toast" class="glass" role="status" aria-live="polite"></div>

<!-- Search -->
<div class="modal" id="search-modal">
  <div class="card glass dense">
    <h3 data-i18n="search"></h3>
    <input class="input" type="text" id="search-input" autocomplete="off" />
    <div class="list" id="search-results" style="max-height:50vh"></div>
    <div class="btn-row"><button type="button" class="btn press" id="search-close" data-i18n="close"></button></div>
  </div>
</div>

<!-- Enter coordinate -->
<div class="modal" id="coord-modal">
  <div class="card glass dense">
    <h3 data-i18n="coord"></h3>
    <input class="input" type="text" id="coord-input" autocomplete="off" />
    <div class="format-note" id="coord-format-note"></div>
    <div class="btn-row">
      <button type="button" class="btn press" id="coord-close" data-i18n="cancel"></button>
      <button type="button" class="btn primary press" id="coord-go" data-i18n="next"></button>
    </div>
  </div>
</div>

<div id="gate" style="display:none">
  <div class="card glass">
    <div class="gate-lang"><button type="button" class="icon-btn lang-btn press" data-lang-toggle></button></div>

  </div>
</div>

    fab.setAttribute('aria-label', pendingMode ? t('cancel_pick') : t('open_menu'));
    if (pendingMode) $('hint').textContent = t('hint_' + pendingMode);
  }

  // ── Theme accent (mirrors the desktop setting) ─────────────
  // Cached locally so the page opens in the right colour before the
  // first status poll comes back.
  const ACCENT_KEY = 'locwarp.phone.accent';
  const ACCENT_RE = /^\d{1,3}, \d{1,3}, \d{1,3}$/;
  let accentRgb = '108, 140, 255';
  function accentColor() { return 'rgb(' + accentRgb + ')'; }
  function applyAccent(rgb, persist) {
    if (!rgb || !ACCENT_RE.test(rgb) || rgb === accentRgb) return;
    accentRgb = rgb;
    document.documentElement.style.setProperty('--accent-rgb', rgb);
    if (typeof routePolyline !== 'undefined' && routePolyline) routePolyline.setStyle({ color: accentColor() });
    if (persist) { try { localStorage.setItem(ACCENT_KEY, rgb); } catch (e) { /* ignore */ } }
  }
  try { applyAccent(localStorage.getItem(ACCENT_KEY), false); } catch (e) { /* ignore */ }

  let pollTimer = null;
  async function pollStatus() {
    try {
      const s = await api('/api/phone/status');
      lastStatus = s;
      applyAccent(s.accent_rgb, true);
      if (s.coord_format && (s.coord_format.datum !== fmt.datum || s.coord_format.order !== fmt.order)) {
        fmt = { datum: s.coord_format.datum, order: s.coord_format.order };
        refreshFormatTexts();
      }
      if (s.connected && s.current_position) {
        const cp = s.current_position;
        const isRestored = restoredPos && Math.abs(restoredPos.lat - cp.lat) < 1e-7 && Math.abs(restoredPos.lng - cp.lng) < 1e-7;
        if (isRestored) clearCurrentPin();
        else {
          restoredPos = null;
          setCurrentPin(cp.lat, cp.lng);
          if (lastState !== s.state && (s.state === 'teleporting' || s.state === 'idle')) {
            map.setView([cp.lat, cp.lng], Math.max(map.getZoom(), 15));
          }
        }
      } else clearCurrentPin();
      // Cleared by the backend when the sim stops, so no client-side expiry.
      setRoutePath(s.route_path);
      lastState = s.state;
      renderDevicePills(); renderNowbar();
      recenter.classList.toggle('off', !hasPosition());
      if (openId === 'menu') refreshMenu();
    } catch (e) { /* silently */ }
  }
  // Poll faster while something is moving so the progress bar and the
  // position marker stay smooth.
  function schedulePoll() {
    if (pollTimer) clearTimeout(pollTimer);
    pollTimer = setTimeout(async () => {
      if (token && !document.hidden) await pollStatus();
      schedulePoll();
    }, isMoving() ? 1000 : 2000);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && token) pollStatus(); });

  recenter.addEventListener('click', () => {
    if (!hasPosition()) { toast(t('no_position_recenter'), 'err'); return; }
    const cp = lastStatus.current_position;
    map.flyTo([cp.lat, cp.lng], Math.max(map.getZoom(), 16), { duration: 0.6 });
  });

  // ── Speed picker (shared by navigate confirm + speed sheet) ─
  const SPEEDS = [['walking', 'walk', 10.8], ['running', 'bike', 19.8], ['driving', 'drive', 60]];
  let speedMode = 'walking';
  function renderSpeedSegs() {
    document.querySelectorAll('[data-speed-seg]').forEach((seg) => {
      seg.innerHTML = '';
      SPEEDS.forEach(([mode, key, kmh]) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'press' + (mode === speedMode ? ' active' : '');
        b.innerHTML = '<span></span><small></small>';
        b.firstChild.textContent = t(key);
        b.lastChild.textContent = kmh + ' km/h';
        b.addEventListener('click', () => { speedMode = mode; renderSpeedSegs(); });
        seg.appendChild(b);
      });
    });
  }
  function readCustomKmh(inputId) {
    const raw = $(inputId).value.trim();
    const n = raw === '' ? NaN : parseFloat(raw);
    return Number.isFinite(n) && n > 0 ? n : null;
  }

  // ── Confirm / place sheet ─────────────────────────────────
  // kind: 'place' (offer teleport + navigate), 'teleport', 'navigate',
  // 'stop', 'restore'. `place` is { lat, lng, name? } in WGS84.
  function button(cls, label, onClick) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn press ' + cls; b.textContent = label;
    b.addEventListener('click', onClick);
    return b;
  }
  function openConfirm(kind, place) {
    pendingAction = { kind, place: place || null };
    const title = $('confirm-title'), coord = $('confirm-coord'), row = $('confirm-buttons');
    $('confirm-speed').style.display = kind === 'navigate' ? '' : 'none';
    row.innerHTML = '';
    if (place) coord.textContent = formatCoord(place.lat, place.lng);
    const cancel = button('', t('cancel'), hideSheet);
    if (kind === 'place') {
      title.textContent = place.name || formatCoord(place.lat, place.lng, 5);
      const nav = button('go', t('navigate'), () => {
        if (!hasPosition()) { toast(t('no_position'), 'err'); return; }
        openConfirm('navigate', place);
      });
      row.append(cancel, nav, button('primary', t('teleport'), () => runConfirm('teleport')));
    } else if (kind === 'teleport') {
      title.textContent = place.name || t('c_teleport');
      row.append(cancel, button('primary', t('teleport'), () => runConfirm('teleport')));
    } else if (kind === 'navigate') {
      title.textContent = place.name || t('c_navigate');
      $('confirm-custom').value = '';
      row.append(cancel, button('primary', t('start_nav'), () => runConfirm('navigate')));
    } else if (kind === 'stop') {
      title.textContent = t('c_stop'); coord.textContent = t('c_stop_ds');
      row.append(cancel, button('danger', t('stop'), () => runConfirm('stop')));
    } else if (kind === 'restore') {
      title.textContent = t('c_restore'); coord.textContent = t('c_restore_ds');
      row.append(cancel, button('danger', t('restore'), () => runConfirm('restore')));
    }
    showSheet('confirm');
  }
  let busy = false;
  async function runConfirm(kind) {
    if (busy || !pendingAction) return;
    const place = pendingAction.place;
    const buttons = $('confirm-buttons').querySelectorAll('button');
    busy = true;
    buttons.forEach((b) => { b.disabled = true; });
    try {
      if (kind === 'teleport') {
        await api('/api/phone/teleport', { method: 'POST', body: { lat: place.lat, lng: place.lng, name: place.name || null } });
        toast(t('sent_teleport'));
      } else if (kind === 'navigate') {
        // Custom km/h takes precedence; an empty box falls back to the
        // selected mode's preset.
        const kmh = readCustomKmh('confirm-custom');
        const body = { lat: place.lat, lng: place.lng, mode: speedMode, name: place.name || null };
        if (kmh) body.speed_kmh = kmh;
        await api('/api/phone/navigate', { method: 'POST', body });
        toast(kmh ? t('sent_navigate_kmh', { kmh }) : t('sent_navigate'));
      } else if (kind === 'stop') {
        await api('/api/phone/stop', { method: 'POST' });
        toast(t('sent_stop'));
      } else if (kind === 'restore') {
        // Capture the position first so later polls know to hide the
        // (now stale) green pin.
        if (lastStatus && lastStatus.current_position) restoredPos = Object.assign({}, lastStatus.current_position);
        await api('/api/phone/restore', { method: 'POST' });
        clearCurrentPin();
        toast(t('sent_restore'));
      }
      hideSheet();
      pollStatus();
    } catch (e) {
      fail(e);
      buttons.forEach((b) => { b.disabled = false; });
    } finally { busy = false; }
  }
  // Show a place on the map and offer teleport / navigate for it.
  function offerPlace(place) {
    setPendingPin(place.lat, place.lng);
    map.setView([place.lat, place.lng], Math.max(map.getZoom(), 15));
    openConfirm('place', place);
  }

  // ── Now-moving bar actions ────────────────────────────────
  $('nb-pause').addEventListener('click', async () => {
    const paused = isPaused();
    try {
      await api(paused ? '/api/phone/resume' : '/api/phone/pause', { method: 'POST' });
      toast(t(paused ? 'sent_resume' : 'sent_pause'));
      pollStatus();
    } catch (e) { fail(e); }
  });
  $('nb-stop').addEventListener('click', () => openConfirm('stop'));
  $('nb-speed').addEventListener('click', () => { $('speed-custom').value = ''; showSheet('speed'); });
  $('speed-apply').addEventListener('click', async () => {
    const kmh = readCustomKmh('speed-custom');
    const body = { mode: speedMode };
    if (kmh) body.speed_kmh = kmh;
    try {
      const r = await api('/api/phone/speed', { method: 'POST', body });
      hideSheet();
      toast(t('sent_speed', { kmh: r.speed_kmh }));
      pollStatus();
    } catch (e) { fail(e); }
  });

  // ── Saved coordinates / recent ────────────────────────────
  const CHEV = '<span class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg></span>';
  const ICON_BOLT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z" /></svg>';
  const ICON_NAV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3 11 22 2 13 21 11 13 3 11" /></svg>';
  let placesKind = 'bookmarks', placesData = null, placesCat = 'all';
  function emptyNode(text) {
    const d = document.createElement('div');
    d.className = 'empty'; d.textContent = text;
    return d;
  }
  function placeRow(lead, name, sub, onClick) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'row press';
    b.innerHTML = lead + '<span class="rt"><span class="rn"></span><span class="rs"></span></span>' + CHEV;
    b.querySelector('.rn').textContent = name;
    b.querySelector('.rs').textContent = sub;
    b.addEventListener('click', onClick);
    return b;
  }
  function timeAgo(ts) {
    const s = Math.max(0, Date.now() / 1000 - ts);
    if (s < 60) return t('just_now');
    if (s < 3600) return t('min_ago', { n: Math.floor(s / 60) });
    if (s < 86400) return t('hr_ago', { n: Math.floor(s / 3600) });
    return t('day_ago', { n: Math.floor(s / 86400) });
  }
  const safeColor = (c) => (/^#[0-9a-fA-F]{3,8}$/.test(c || '') ? c : '#6c8cff');
  function renderPlaces() {
    const list = $('places-list'), chips = $('places-chips');
    const q = $('places-filter').value.trim().toLowerCase();
    list.innerHTML = '';
    if (!placesData) return;
    const frag = document.createDocumentFragment();
    if (placesKind === 'bookmarks') {
      const cats = placesData.categories || [], all = placesData.bookmarks || [];
      const color = {}, cname = {};
      cats.forEach((c) => { color[c.id] = safeColor(c.color); cname[c.id] = c.name; });
      chips.innerHTML = '';
      [{ id: 'all', name: t('all') }].concat(cats).forEach((c) => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip press' + (placesCat === c.id ? ' active' : '');
        if (c.color) { const dot = document.createElement('i'); dot.style.background = safeColor(c.color); chip.appendChild(dot); }
        chip.appendChild(document.createTextNode(c.name));
        chip.addEventListener('click', () => { placesCat = c.id; renderPlaces(); });
        chips.appendChild(chip);
      });
      const items = all.filter((b) =>
        (placesCat === 'all' || b.category_id === placesCat) && (!q || (b.name || '').toLowerCase().includes(q)));
      if (items.length === 0) frag.appendChild(emptyNode(all.length ? t('empty_filter') : t('empty_bookmarks')));
      items.forEach((b) => {
        const lead = '<span class="bar" style="background:' + (color[b.category_id] || '#6c8cff') + '"></span>';
        const sub = (placesCat === 'all' && cname[b.category_id] ? cname[b.category_id] + ' · ' : '') + formatCoord(b.lat, b.lng, 5);
        frag.appendChild(placeRow(lead, b.name, sub, () => offerPlace({ lat: b.lat, lng: b.lng, name: b.name })));
      });
    } else {
      const items = placesData.filter((r) => !q || (r.name || '').toLowerCase().includes(q));
      if (items.length === 0) frag.appendChild(emptyNode(placesData.length ? t('empty_filter') : t('empty_recent')));
      items.forEach((r) => {
        const isNav = r.kind === 'navigate' || r.kind === 'coord_navigate';
        const coord = formatCoord(r.lat, r.lng, 5);
        const lead = '<span class="rc">' + (isNav ? ICON_NAV : ICON_BOLT) + '</span>';
        frag.appendChild(placeRow(lead, r.name || coord, (r.name ? coord + ' · ' : '') + timeAgo(r.ts),
          () => offerPlace({ lat: r.lat, lng: r.lng, name: r.name || null })));
      });
    }
    list.appendChild(frag);
  }
  async function openPlaces(kind) {
    placesKind = kind; placesData = null; placesCat = 'all';
    $('places-title').textContent = t(kind);
    $('places-filter').value = '';
    $('places-chips').style.display = kind === 'bookmarks' ? '' : 'none';
    $('places-chips').innerHTML = '';
    $('places-list').innerHTML = '';
    showSheet('places');
    try {
      const data = await api(kind === 'bookmarks' ? '/api/phone/bookmarks' : '/api/phone/recent');
      if (openId !== 'places' || placesKind !== kind) return;
      placesData = data;
      renderPlaces();
    } catch (e) {
      $('places-list').innerHTML = '';
      $('places-list').appendChild(emptyNode(t('load_failed', { msg: e.message })));
    }
  }
  $('places-filter').addEventListener('input', renderPlaces);

  // ── Add to Home Screen ────────────────────────────────────
  const standalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (standalone) $('install-tile').style.display = 'none';
  function openInstall() {
    const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const steps = $('install-steps');
    steps.innerHTML = '';
    (ios ? ['ios_1', 'ios_2', 'ios_3'] : ['and_1', 'and_2', 'and_3']).forEach((k) => {
      const li = document.createElement('li');
      li.textContent = t(k);
      steps.appendChild(li);
    });
    showSheet('install');
  }

  // ── Menu tiles ────────────────────────────────────────────
  document.querySelectorAll('#menu .tile').forEach((btn) => {
    btn.addEventListener('click', () => {
      const kind = btn.getAttribute('data-kind');
      if (kind === 'teleport') { hideSheet(); setPendingMode('teleport'); }
      else if (kind === 'navigate') {
        // Navigate routes from the *current* virtual position; without
        // one the backend has no origin, so explain instead of arming.
        if (!hasPosition()) { toast(t('no_position'), 'err'); return; }
        hideSheet(); setPendingMode('navigate');
      }
      else if (kind === 'bookmarks' || kind === 'recent') openPlaces(kind);
      else if (kind === 'search') { hideSheet(); openSearch(); }
      else if (kind === 'coord') { hideSheet(); openCoord(); }
      else if (kind === 'stop' || kind === 'restore') openConfirm(kind);
      else if (kind === 'install') openInstall();
    });
  });

  // ── Search ────────────────────────────────────────────────
  const searchModal = $('search-modal'), searchInput = $('search-input'), searchResults = $('search-results');
  $('search-close').addEventListener('click', () => searchModal.classList.remove('open'));
  searchModal.addEventListener('click', (e) => { if (e.target === searchModal) searchModal.classList.remove('open'); });
  function openSearch() {
    searchInput.value = ''; searchResults.innerHTML = '';
    searchModal.classList.add('open');
    setTimeout(() => searchInput.focus(), 120);
  }
  let searchTimer = null, searchSeq = 0;
  searchInput.addEventListener('input', () => {
    if (searchTimer) clearTimeout(searchTimer);
    const q = searchInput.value.trim();
    if (q.length < 2) { searchResults.innerHTML = ''; return; }
    searchTimer = setTimeout(async () => {
      const seq = ++searchSeq;
      try {
        const items = await api('/api/phone/geocode?q=' + encodeURIComponent(q));
        if (seq !== searchSeq) return;
        searchResults.innerHTML = '';
        if (!items || items.length === 0) { searchResults.appendChild(emptyNode(t('no_results'))); return; }
        items.forEach((it) => {
          const name = it.short_name || it.display_name;
          searchResults.appendChild(placeRow('', name, it.display_name, () => {
            searchModal.classList.remove('open');
            searchInput.blur();
            offerPlace({ lat: it.lat, lng: it.lng, name });
          }));
        });
      } catch (e) {
        if (seq !== searchSeq) return;
        searchResults.innerHTML = '';
        searchResults.appendChild(emptyNode(t('search_failed', { msg: e.message })));
      }
    }, 350);
  });

  // ── Enter coordinate ──────────────────────────────────────
  const coordModal = $('coord-modal'), coordInput = $('coord-input');
  $('coord-close').addEventListener('click', () => coordModal.classList.remove('open'));
  coordModal.addEventListener('click', (e) => { if (e.target === coordModal) coordModal.classList.remove('open'); });
  function openCoord() {
    coordInput.value = '';
    coordModal.classList.add('open');
    setTimeout(() => coordInput.focus(), 120);
  }
  function submitCoord() {
    const parsed = parseCoord(coordInput.value);
    if (!parsed) { toast(t('bad_coord'), 'err'); return; }
    coordModal.classList.remove('open');
    coordInput.blur();
    offerPlace({ lat: parsed.lat, lng: parsed.lng, name: null });
  }
  $('coord-go').addEventListener('click', submitCoord);
  coordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitCoord(); });

  // ── PIN gate ──────────────────────────────────────────────
  const gate = $('gate'), pinInput = $('pin-input'), pinSubmit = $('pin-submit'), pinErr = $('pin-err');
  function showGate() {
    gate.style.display = '';
    pinInput.value = ''; pinErr.textContent = ''; pinSubmit.disabled = true;
    setTimeout(() => pinInput.focus(), 100);
  }
  // Tell the desktop UI "this phone reached the LAN URL" so it can tell
  // "wrong IP" apart from "PIN typo". Fire-and-forget.
  fetch('/api/phone/_reach').catch(() => {});
  pinInput.addEventListener('input', () => {
    pinInput.value = pinInput.value.replace(/\D/g, '').slice(0, 6);
    pinSubmit.disabled = pinInput.value.length !== 6;
    pinErr.textContent = '';
  });
  pinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !pinSubmit.disabled) pinSubmit.click(); });
  pinSubmit.addEventListener('click', async () => {
    pinSubmit.disabled = true; pinErr.textContent = '';
    try {
      const r = await fetch('/api/phone/auth', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: pinInput.value }),
      });
      if (r.status === 429) {
        let wait = 60;
        try { wait = (await r.json()).detail.retry_after || wait; } catch (e) { /* keep default */ }
        pinErr.textContent = t('pin_locked').replace('{n}', String(wait));
        pinSubmit.disabled = false;
        return;
      }
      if (!r.ok) { pinErr.textContent = t('pin_wrong'); pinSubmit.disabled = false; return; }
      token = (await r.json()).token;
      ls('locwarp.phone.token', token);
      gate.style.display = 'none';
      pollStatus();
    } catch (e) {
      pinErr.textContent = t('pin_fail'); pinSubmit.disabled = false;
    }
  });

  // If we boot already zoomed (Chrome restored a per-origin zoom level),
  // say how to recover.
  setTimeout(() => {
    const vv = window.visualViewport;
    if (!vv || vv.scale <= 1.05) return;
    const tip = document.createElement('div');
    tip.textContent = t('zoomed');
    tip.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#ef5d5d;color:#fff;padding:10px 14px;font-size:13px;text-align:center;font-weight:600;';
    document.body.appendChild(tip);
    setTimeout(() => tip.remove(), 8000);
  }, 800);

  // ── Boot ──────────────────────────────────────────────────
  document.querySelectorAll('[data-lang-toggle]').forEach((el) => {
    el.addEventListener('click', () => { lang = lang === 'zh' ? 'en' : 'zh'; ls('locwarp.phone.lang', lang); applyI18n(); });
  });
  applyI18n();
  token = ls('locwarp.phone.token');
  if (!token) showGate(); else pollStatus();
  schedulePoll();
})();
</script>
</body>
</html>
